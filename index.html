<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Naya" />
    <meta name="color-scheme" content="light dark" />

    <title>Naya's Candle</title>

    <link rel="stylesheet" href="./css/normal.css" />

    <script
      data-page="https://naya404.nl"
      src="./scripts/main.js"
      defer
    ></script>
  </head>

  <body>
    <header>
      <a href="index.html">Naya's Candle</a>

      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#collecties">Collecties</a></li>
          <li><a href="#over-mij">Over mij</a></li>
          <li><a href="#maakproces">Maakproces</a></li>
        </ul>
      </nav>

      <input type="checkbox" id="lichtknop" />

      <label for="lichtknop">
        <span>Lights off</span>
        <span>Lights on</span>
      </label>
    </header>

    <main>
      <section id="home">
        <h1>Mijn showroom van handgemaakte kaarsen</h1>

        <ul class="categorieen" id="collecties">
          <li>
            <h2>Drank</h2>
            <img src="./images/wiskey.JPG" alt="Whiskeykaarsen" />
          </li>

          <li>
            <h2>Ramadan</h2>
            <img src="./images/ramadan.JPG" alt="Ramadankaarsen" />
          </li>

          <li>
            <h2>Pasen</h2>
            <img src="./images/pasen.JPG" alt="Paaskaarsen" />
          </li>
          <li>
            <h2>Kerst</h2>
            <img src="./images/kerst.JPG" alt="Kerstkaarsen" />
          </li>
        </ul>
        <figure class="hoofdkaars">
          <img
            src="./images/Hoofdkaars.JPG"
            alt="Mijn handgemaakte paaskaarsen"
          />
        </figure>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
